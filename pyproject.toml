[project]
name = "retail-medallion-aws"
version = "0.1.0"
description = "Medallion Architecture ETL Pipeline on AWS S3, MWAA, RDS PostgreSQL and Terraform."
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.34,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]